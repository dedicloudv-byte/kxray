<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Subscription Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Proxy Subscription Generator</h1>
            <p>Create custom subscription links based on your filters.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="country-filter">Country Codes (comma-separated)</label>
                <input type="text" id="country-filter" placeholder="e.g., ID,SG,US">
            </div>

            <button id="generate-btn">Generate Link</button>

            <div id="result-area" class="hidden">
                <label>Your Subscription Link:</label>
                <div class="result-box">
                    <pre id="sub-link"></pre>
                    <button id="copy-btn" title="Copy to Clipboard">
                        <svg fill="currentColor" viewBox="0 0 20 20"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm-1 4H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 12H7V7h8v10z"></path></svg>
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by a custom solution on Koyeb. Inspired by Nautica.</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
