# koyeb.yaml
# Konfigurasi untuk men-deploy aplikasi manajemen proksi Node.js.
name: proxy-manager-web
services:
  - name: app
    instance_type: free
    git:
      branch: main
      repository: "github.com/user/repo" # Ganti dengan URL repositori Anda
    docker:
      dockerfile: Dockerfile
    regions:
      - fra # Anda bisa memilih region lain yang tersedia
    ports:
      - port: 8080
        protocol: HTTP
    health_checks:
      - port: 8080
        type: http
        path: /api/v1/status # Gunakan endpoint status untuk health check yang lebih andal