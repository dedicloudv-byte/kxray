# koyeb.yaml
name: xray-vless-web-app
services:
  - name: app
    instance_type: free
    git:
      branch: main
      repository: "github.com/user/repo" # Ganti dengan URL repositori Anda
    docker:
      dockerfile: Dockerfile
    regions:
      - fra # Anda bisa memilih region lain yang tersedia
    ports:
      - port: 8080 # Diperbaiki: Sesuaikan dengan port internal Nginx
        protocol: HTTP
    env:
      - key: UUID
        value: "a7a5b3a2-b1c5-4d8f-8a2e-9f6c3e7d1b9f" # WAJIB: Ganti dengan UUID Anda sendiri
      - key: APP_URL
        value: "https://nina.koyeb.app" # WAJIB: Ganti dengan URL publik aplikasi Koyeb Anda
    health_checks:
      - port: 8080 # Diperbaiki: Sesuaikan dengan port internal Nginx
        type: http
        path: /